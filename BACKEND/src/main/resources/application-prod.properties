# Perfil de produccion. Todo credencial/secreto viene de variables de entorno,
# sin ningun default inseguro: si falta alguna, el arranque falla (a proposito,
# mejor que arrancar con un valor por defecto debil).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

app.jwt.secret=${JWT_SECRET}

# Un solo origen real (la URL publica del frontend, ej. https://midominio.com).
# Puede llevar varios separados por coma si hace falta (ej. dominio + IP de LAN).
app.cors.allowed-origins=${APP_FRONTEND_URL}

# El backend NUNCA se expone directo a la red: solo escucha en localhost.
# Todo el trafico externo entra por el reverse proxy TLS (Caddy/Nginx) en el
# puerto 443, que redirige a http://127.0.0.1:8080 (ver README-DEPLOY.md).
server.address=127.0.0.1

spring.jpa.show-sql=false
