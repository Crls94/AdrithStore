# Activar DESPUES de prod: SPRING_PROFILES_ACTIVE=prod,cloud
# prod sigue proporcionando credenciales obligatorias y CORS.
server.address=0.0.0.0
server.port=${PORT:8080}
spring.devtools.restart.enabled=false

# TEST cloud usa esquema previamente preparado. No ejecutar seed/migraciones
# al escalar o arrancar instancias; validar el esquema existente.
spring.sql.init.mode=never
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=validate
app.db-migration-runner.enabled=false

# Pool inicial de TEST; medir antes de promover a produccion.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.keepalive-time=0
spring.datasource.hikari.idle-timeout=60000

# Debe apuntar a almacenamiento persistente montado. Sin fallback efimero.
app.upload.dir=${UPLOAD_DIR}
