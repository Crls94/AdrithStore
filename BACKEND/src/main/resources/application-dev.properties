# Perfil de desarrollo local. Los defaults aca apuntan a un Postgres local
# tipico de una maquina de desarrollo - no se usan en produccion.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Secreto de desarrollo, NO usar en produccion. En prod, JWT_SECRET es
# obligatorio (application-prod.properties no trae default).
app.jwt.secret=${JWT_SECRET}

# Origenes permitidos para el frontend en dev. El default "*" acepta cualquier
# origen (localhost, 127.0.0.1, IP de LAN...): es seguro porque la autenticacion
# es 100% JWT en header, sin cookies ni credenciales. En prod se mantiene estricto
# en un unico origen (APP_FRONTEND_URL, ver application-prod.properties).
# Si se necesita limitar, sobrescribir APP_FRONTEND_URL como lista separada por comas.
app.cors.allowed-origins=${APP_FRONTEND_URL:*}

spring.jpa.show-sql=false
