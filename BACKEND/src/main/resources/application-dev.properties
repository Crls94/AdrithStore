# Perfil de desarrollo local. Los defaults aca apuntan a un Postgres local
# tipico de una maquina de desarrollo - no se usan en produccion.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/AdrithStore}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Secreto de desarrollo, NO usar en produccion. En prod, JWT_SECRET es
# obligatorio (application-prod.properties no trae default).
app.jwt.secret=${JWT_SECRET:dev-only-secret-nunca-usar-en-produccion-cambiame-1234567890}

# Origenes permitidos para el frontend en dev (Vite puede levantar en 5173 o
# 5174 si el primero esta ocupado).
app.cors.allowed-origins=${APP_FRONTEND_URL:http://localhost:5173,http://localhost:5174}

spring.jpa.show-sql=false
