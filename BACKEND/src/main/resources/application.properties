# Configuracion comun a todos los perfiles - sin secretos ni credenciales.
# Las credenciales de BD y el secreto JWT viven en application-dev.properties
# (con defaults locales) y application-prod.properties (obligatorios via env var).
# Perfil activo por defecto si no se especifica ninguno (ej. "mvnw spring-boot:run"
# sin flags en desarrollo). En produccion el systemd unit pasa explicitamente
# --spring.profiles.active=prod, que tiene prioridad sobre este default.
spring.profiles.default=dev

# Flyway es ahora el unico responsable del esquema; Hibernate solo valida que
# las entidades coincidan con lo que Flyway ya creo/migro (no lo modifica).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
# La base de datos ya tenia el esquema de V1__baseline.sql creado por Hibernate
# ddl-auto=update antes de introducir Flyway: baseline-on-migrate hace que Flyway
# la marque como "ya en V1" en vez de intentar recrear las tablas (fallaria,
# ya existen). Una base de datos nueva (vacia) sigue corriendo V1 normalmente.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=baseline inicial (pre-Flyway)

# Seed de categorias/productos (data.sql) - independiente de Flyway, sigue
# corriendo despues de que el esquema este listo; los inserts son idempotentes.
spring.sql.init.mode=always
# OJO: defer-datasource-initialization=true (la config "de manual" para usar
# data.sql junto con JPA) rompe el arranque acá: hace que el inicializador de
# data.sql dependa de entityManagerFactory, que a su vez depende de Flyway
# (para no validar el esquema antes de migrar) -> ciclo "Circular depends-on
# relationship between 'flyway' and 'entityManagerFactory'". Con Flyway ya
# manejando el esquema, data.sql no necesita esperar a Hibernate para nada,
# así que esto va en false (bug/limite conocido de Spring Boot al combinar
# Flyway + defer-datasource-initialization, no algo que dependa de esta app).
spring.jpa.defer-datasource-initialization=false

server.port=8080

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:600}

# La autenticacion es 100% JWT manual (ver security/), no usamos UserDetailsService/httpBasic/
# formLogin de Spring Security, asi que este auto-config solo generaria un usuario/password
# in-memory inerte y ruidoso en el log de arranque.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

spring.devtools.restart.enabled=true
